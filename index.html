<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandStamp - Live Band Lineup Authenticity Index</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="brand">
      <img src="logo.png" alt="BandStamp Logo" class="logo" style="width: 40px;" />
      <span class="brand-title">BandStamp</span>
    </a>
    <nav>
      <a href="index.html" class="active">Audit</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>BandStamp Verification</h1>
      <p>Evaluate the original member ratio for touring bands before buying tickets.</p>

      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="artist-input" 
          class="search-input" 
          placeholder="Enter band or artist name..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="search-btn" class="btn-submit">Inspect Lineup</button>
      </form>
    </section>

    <div id="loading-spinner" class="spinner" style="display: none;"></div>

    <section id="results-container"></section>
  </main>

  <footer>
    <p>&copy; 2026 BandStamp. Evaluating live music lineup authenticity.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
